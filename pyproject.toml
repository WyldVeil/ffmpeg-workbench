[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyldveil-media-editor"
version = "1.2.4"
description = "WyldVeil's Media Editor: video and audio toolkit powered by FFmpeg"
requires-python = ">=3.10"
dependencies = [
    "tkinterdnd2>=0.7.0",
]

[project.scripts]
wyldveil-media-editor = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tabs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
