[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmpeg-workbench"
version = "1.2.6"
description = "FFmpeg Workbench: a video and audio toolkit powered by FFmpeg"
requires-python = ">=3.11"
dependencies = [
    "tkinterdnd2>=0.7.0",
]

[project.scripts]
ffmpeg-workbench = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "shell*", "tabs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rule set the books recommend (Robust Python ch. 20, Effective Python items 85/123,
# Fluent Python ch. 6/9). No rule is set aside as debt: every function stays under complexity 15,
# 8 parameters (spec dataclasses group the rest) and 50 statements (tests/test_architecture.py also
# caps it at 120 lines).  Keep it that way - fix the code, don't add an ignore.
select = ["E", "F", "W", "I", "B", "BLE", "SIM", "RUF", "UP", "SLF", "S110", "PLR0913", "PLR0915", "C90", "TID"]
ignore = [
    "E501",     # long lines: readability call, not enforced
    "RUF001", "RUF002", "RUF003",  # typographic characters (× – … ‘ ’) are intentional UI text
    "SIM108",   # ternaries are not always clearer
    "SIM102",   # "if X: if not ask(...): return" reads better than one long condition
]

[tool.ruff.format]
# ruff format is the one style; CI checks it (`ruff format --check`).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "BLE001", "S110", "SIM105", "SIM115"]   # tests look inside objects, catch anything to
                                                               # report it, and open scratch files briefly

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50
