[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyldveil-media-editor"
version = "1.2.5"
description = "WyldVeil's Media Editor: video and audio toolkit powered by FFmpeg"
requires-python = ">=3.11"
dependencies = [
    "tkinterdnd2>=0.7.0",
]

[project.scripts]
wyldveil-media-editor = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "shell*", "tabs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rule set the books recommend (Robust Python ch. 20, Effective Python items 85/123,
# Fluent Python ch. 6/9). Each "DEBT" entry below is existing code still to be fixed;
# entries are removed as the code is cleaned up, never added (docs/knowledge/adoption-ledger.md).
select = ["E", "F", "W", "I", "B", "BLE", "SIM", "RUF", "UP", "SLF", "S110", "PLR0913", "C90", "TID"]
ignore = [
    "E501",     # long lines: readability call, not enforced
    "RUF001", "RUF002", "RUF003",  # typographic characters (× – … ‘ ’) are intentional UI text
    "SIM108",   # ternaries are not always clearer
    "SIM102",   # "if X: if not ask(...): return" reads better than one long condition
    # ── DEBT ──
    "C901",      # 5 functions over the complexity limit (the next to split)
    "PLR0913",   # 31 long signatures, mostly keyword-only builder options (candidates for spec dataclasses)
]

[tool.ruff.format]
# ruff format is the one style; CI checks it (`ruff format --check`).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "BLE001", "S110", "SIM105", "SIM115"]   # tests look inside objects, catch anything to
                                                               # report it, and open scratch files briefly

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 8
